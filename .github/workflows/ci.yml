# Default checks use GitHub-hosted runners. The explicit prepared-image smoke
# requires a separately provisioned, dedicated validation runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prepared_linux:
        description: Run two isolated prepared Linux smoke jobs (requires dedicated validation runner)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - run: go build ./...
      - name: Tests (including an isolated native Windows credential fixture)
        env:
          BIVOUAC_WINDOWS_CREDENTIAL_TEST: ${{ runner.os == 'Windows' && '1' || '0' }}
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: VM configurations (signed test binary)
        if: runner.os == 'macOS'
        env:
          BIVOUAC_VM_SIGNED_TESTS: '1'
        run: |
          go test -c -o "$RUNNER_TEMP/vm.test" ./internal/vm
          codesign --force --sign - --entitlements tools/macos/bivouac.entitlements "$RUNNER_TEMP/vm.test"
          "$RUNNER_TEMP/vm.test" -test.run 'TestConfigurationsValidate|TestEntitled' -test.v
      - name: Crosvm packet filter tests
        if: runner.os == 'Linux'
        run: |
          rustc --version
          rustc --test --edition 2021 tools/crosvm/public_ipv4.rs -o "$RUNNER_TEMP/public-ipv4-tests"
          "$RUNNER_TEMP/public-ipv4-tests"

  prepared-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.prepared_linux
    runs-on: bivouac-linux-prepared-validation
    timeout-minutes: 3
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        clone: [1, 2]
    steps:
      - name: Verify prepared guest and fresh job state
        shell: bash
        run: |
          set -euo pipefail
          test -f /etc/bivouac/prepared-image.json
          test -x /usr/local/libexec/bivouac-guest
          test "$(stat -c %u /usr/local/libexec/bivouac-guest)" = 0
          test "$(readlink /tmp/bivouac-runner/helper)" = /usr/local/libexec/bivouac-guest
          test ! -e /var/tmp/bivouac-prepared-validation-sentinel
          touch /var/tmp/bivouac-prepared-validation-sentinel
          test -c /dev/dri/renderD128
          test "$(cat /sys/class/drm/renderD128/device/vendor)" = 0x1af4
          test -f /etc/cdi/ci-gpu.json
          docker info --format '{{.ServerVersion}}'
          getent ahostsv4 github.com >/dev/null
          curl --fail --silent --show-error --max-time 20 --output /dev/null https://api.github.com
