# Lints and tests bivouac itself on GitHub-hosted runners only.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - run: go build ./...
      - name: Tests (including an isolated native Windows credential fixture)
        env:
          BIVOUAC_WINDOWS_CREDENTIAL_TEST: ${{ runner.os == 'Windows' && '1' || '0' }}
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Crosvm packet filter tests
        if: runner.os == 'Linux'
        run: |
          rustc --version
          rustc --test --edition 2021 tools/crosvm/public_ipv4.rs -o "$RUNNER_TEMP/public-ipv4-tests"
          "$RUNNER_TEMP/public-ipv4-tests"
